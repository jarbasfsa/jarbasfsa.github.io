<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Notícias do Brasil - G1</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    #noticias {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: #d60000;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 16px;
      z-index: 999;
    }

    #conteudo {
      margin-top: 50px;
      padding: 20px;
    }

    .ticker {
      white-space: nowrap;
      animation: rodar 90s linear infinite;
    }

    .ticker a {
      color: white;
      text-decoration: none;
      margin-right: 30px;
    }

    .ticker a:hover {
      text-decoration: underline;
    }

    @keyframes rodar {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="noticias">
    <div class="ticker" id="ticker">Carregando notícias...</div>
  </div>

  

  <script>
    async function carregarRSS() {
      const url = 'https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/dynamo/brasil/rss2.xml';
      try {
        const res = await fetch(url);
        const data = await res.json();
        const ticker = document.getElementById('ticker');
        ticker.innerHTML = ''; // Limpa conteúdo anterior

        data.items.forEach(item => {
          const link = document.createElement('a');
          link.href = item.link;
          link.textContent = item.title;
          link.target = '_blank'; // Abre em nova aba
          ticker.appendChild(link);
        });
      } catch (err) {
        document.getElementById('ticker').textContent = 'Erro ao carregar notícias.';
      }
    }

    carregarRSS();
  </script>
 <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

<iframe src="https://player.srvsh.com.br/player-web/7342" frameborder="0" width="100%" height="100%"></iframe>
</body>
</html>
