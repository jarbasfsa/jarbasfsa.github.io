<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Notícias e Rádio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #111;
    }

    #noticias {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: #d60000;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 999;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .ticker {
      white-space: nowrap;
      display: inline-block;
      animation: rodar 120s linear infinite; /* Aumentei para 120s para dar tempo de ler mais notícias */
    }

    .ticker:hover {
      animation-play-state: paused;
    }

    .ticker a {
      color: white;
      text-decoration: none;
      margin-right: 40px;
      font-weight: 500;
    }

    .ticker a:hover {
      text-decoration: underline;
    }

    @keyframes rodar {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    iframe {
      position: absolute;
      top: 40px;
      left: 0;
      width: 100%;
      height: calc(100% - 40px);
      border: none;
    }
  </style>
</head>
<body>

  <div id="noticias">
    <div class="ticker" id="ticker">Carregando notícias de várias fontes...</div>
  </div>

  <iframe src="https://player.srvsh.com.br/player-web/7342"></iframe>

  <script>
    // ADICIONE OU REMOVA OS RSS AQUI:
    const rssFeeds = [
      'https://g1.globo.com/dynamo/brasil/rss2.xml',
      'https://tecnoblog.net/feed/', // Exemplo de tecnologia
      'https://ge.globo.com/dynamo/futebol/rss2.xml' // Exemplo de esportes
    ];

    async function carregarMultiplosRSS() {
      const ticker = document.getElementById('ticker');
      ticker.innerHTML = ''; // Limpa o aviso de carregamento

      for (const rssUrl of rssFeeds) {
        try {
          const urlProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
          const res = await fetch(urlProxy);
          const data = await res.json();
          
          const parser = new DOMParser();
          const xml = parser.parseFromString(data.contents, "text/xml");
          const items = xml.querySelectorAll("item");

          items.forEach(item => {
            const titleNode = item.querySelector("title");
            const linkNode = item.querySelector("link");

            if (titleNode && linkNode) {
              const link = document.createElement('a');
              link.href = linkNode.textContent.trim();
              link.textContent = titleNode.textContent.trim();
              link.target = '_blank';
              ticker.appendChild(link);
            }
          });
        } catch (err) {
          console.error('Erro ao carregar o feed:', rssUrl);
        }
      }

      // Se nenhum feed carregar por falha de rede
      if (ticker.children.length === 0) {
        ticker.textContent = '⚠️ Não foi possível carregar as notícias.';
      }
    }

    carregarMultiplosRSS();
  </script>
</body>
</html>
